<?xml version="1.0" encoding="UTF-8"?>
<!--
  iRouter.svg — clean-room line-art router icon (4 antennae + body).
  MIT licensed (matches the plugin). 24x24 viewBox, monochrome
  stroke; consumers apply colour via the per-device accent.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- body -->
  <rect x="3" y="11" width="18" height="9" rx="1" />
  <!-- 4 antennae (top) -->
  <line x1="6"  y1="11" x2="6"  y2="4" />
  <line x1="10" y1="11" x2="10" y2="3" />
  <line x1="14" y1="11" x2="14" y2="3" />
  <line x1="18" y1="11" x2="18" y2="4" />
  <!-- LED row + port dots on body -->
  <circle cx="6"  cy="15.5" r="0.6" fill="currentColor" />
  <circle cx="9"  cy="15.5" r="0.6" fill="currentColor" />
  <line x1="12" y1="15.5" x2="18" y2="15.5" />
  <!-- WAN indicator on body -->
  <circle cx="18" cy="18.5" r="0.6" fill="currentColor" />
</svg>
