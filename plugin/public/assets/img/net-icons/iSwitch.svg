<?xml version="1.0" encoding="UTF-8"?>
<!--
  iSwitch.svg — clean-room line-art network-switch icon (4x2 port grid).
  MIT licensed (matches the plugin). 24x24 viewBox, monochrome
  stroke; consumers apply colour via the per-device accent.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- body -->
  <rect x="2" y="6" width="20" height="12" rx="1" />
  <!-- 4 columns x 2 rows of ports -->
  <rect x="5"  y="9"  width="3" height="2" rx="0.3" />
  <rect x="9"  y="9"  width="3" height="2" rx="0.3" />
  <rect x="13" y="9"  width="3" height="2" rx="0.3" />
  <rect x="17" y="9"  width="3" height="2" rx="0.3" />
  <rect x="5"  y="13" width="3" height="2" rx="0.3" />
  <rect x="9"  y="13" width="3" height="2" rx="0.3" />
  <rect x="13" y="13" width="3" height="2" rx="0.3" />
  <rect x="17" y="13" width="3" height="2" rx="0.3" />
  <!-- status LEDs -->
  <circle cx="3.5" cy="16.5" r="0.5" fill="currentColor" />
</svg>
