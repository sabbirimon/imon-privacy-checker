<?xml version="1.0" encoding="UTF-8"?>
<!--
  iHub.svg — clean-room line-art hub icon (simple box + 4 port dots).
  MIT licensed (matches the plugin). 24x24 viewBox, monochrome
  stroke; consumers apply colour via the per-device accent.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- body -->
  <rect x="3" y="8" width="18" height="8" rx="1" />
  <!-- 4 port dots on the front -->
  <circle cx="7"  cy="12" r="0.7" fill="currentColor" />
  <circle cx="11" cy="12" r="0.7" fill="currentColor" />
  <circle cx="15" cy="12" r="0.7" fill="currentColor" />
  <circle cx="19" cy="12" r="0.7" fill="currentColor" />
</svg>
